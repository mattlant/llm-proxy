[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-proxy-mock-provider"
version = "0.1.0"
description = "Deterministic scenario provider for llm-proxy tests"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12.3"
dependencies = ["llm-proxy>=0.4.0,<1"]

[project.entry-points."llm_proxy.providers"]
deterministic_mock = "llm_proxy_mock_provider.extension:extension"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
