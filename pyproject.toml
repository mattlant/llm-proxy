[project]
name = "llm-proxy"
version = "0.4.0"
description = "Small configurable proxy for rewriting Ollama/OpenAI-compatible request params, model routes, and metadata responses."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12.3"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "packaging>=24",
  "jsonschema>=4.23",
]

[project.scripts]
llm-proxy = "llm_proxy.app:main"

[project.optional-dependencies]
test = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "setuptools>=68",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["llm_proxy*"]

[tool.setuptools.package-data]
llm_proxy = ["static/management/*", "static/management/**/*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "build_backend"
backend-path = ["."]
