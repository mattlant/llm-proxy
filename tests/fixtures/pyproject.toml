[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "example-deterministic-provider"
version = "0.1.0"
requires-python = ">=3.12.3"

[project.entry-points."llm_proxy.providers"]
deterministic = "external_provider.deterministic_provider:DeterministicExtension"

[tool.setuptools.packages.find]
include = ["external_provider*"]
